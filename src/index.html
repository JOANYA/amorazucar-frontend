  <!--
    RENDIMIENTO: el API (Express) vive en OTRO origen que el front (Angular),
    y las fotos del catálogo que forman el LCP salen de ahí. Abrir la conexión
    (DNS + TCP + TLS) antes de que el JS pida la primera imagen ahorra cientos
    de ms en 4G.

    OJO: en local el API es 127.0.0.1:3000. Cuando publiques en la nube,
    cambia estos enlaces por la URL de tu backend (ver environment.prod.ts).
  -->
  <link rel="preconnect" href="http://127.0.0.1:3000">
  <link rel="dns-prefetch" href="http://127.0.0.1:3000">
