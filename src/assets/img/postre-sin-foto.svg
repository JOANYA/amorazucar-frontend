<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Postre sin foto disponible">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF2F5"/>
      <stop offset="1" stop-color="#F7E1E8"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C08A57"/>
      <stop offset="1" stop-color="#9A6538"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#fondo)"/>

  <!-- Plato -->
  <ellipse cx="300" cy="316" rx="132" ry="20" fill="#E7C4CF" opacity="0.55"/>

  <!-- Base del postre -->
  <path d="M232 258 L368 258 L349 318 q-49 18 -98 0 Z" fill="url(#base)"/>

  <!-- Betún -->
  <circle cx="300" cy="240" r="58" fill="#E88BA8"/>
  <circle cx="264" cy="222" r="34" fill="#F0A6BC"/>
  <circle cx="336" cy="222" r="34" fill="#F0A6BC"/>
  <circle cx="300" cy="196" r="30" fill="#F5BACB"/>
  <circle cx="300" cy="170" r="20" fill="#F8CBD8"/>

  <!-- Cereza -->
  <circle cx="300" cy="146" r="12" fill="#A8324A"/>
  <path d="M300 134 q6 -16 20 -20" fill="none" stroke="#6E8B4F" stroke-width="4" stroke-linecap="round"/>

  <!-- Chispas -->
  <g fill="#D9A24A" opacity="0.85">
    <circle cx="200" cy="196" r="4"/>
    <circle cx="222" cy="166" r="3"/>
    <circle cx="404" cy="200" r="4"/>
    <circle cx="380" cy="168" r="3"/>
  </g>
</svg>
